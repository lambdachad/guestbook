app = "guestbook"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "3000"
HOST = "0.0.0.0"
DATABASE_URL = "/data/guestbook.db"
ORIGIN = "https://guestbook.fly.dev"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/api/health"
timeout = "5s"

[[vm]]
memory = "512mb"
cpus = 1

[[mounts]]
source = "guestbook_data"
destination = "/data"
initial_size = "1gb"
